name: Build unsigned ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the latest stable Xcode
        uses: maxim-alexander/setup-xcode@v1
        with:
          xcode-version: latest_stable

      - name: Build the unsigned ipa
        run: sh ./make-ipa.sh

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tube-Lite-ipa
          path: build/Tube Lite.ipa