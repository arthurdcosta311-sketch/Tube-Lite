name: Build unsigned ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Select the newest installed Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep Xcode || true
          latest="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Build the unsigned ipa
        run: sh ./make-ipa.sh

      - name: Upload ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tube-Lite-ipa
          path: build/Tube Lite.ipa